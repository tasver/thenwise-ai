name: Verify public Docker image pulls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-public-images.yml'
permissions:
  contents: read
jobs:
  anonymous-image-check:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Check both GHCR images without registry login
        run: |
          errors=0
          for image in thenwise-video thenwise-audio; do
            echo "CHECK ghcr.io/tasver/${image}:latest"
            docker logout ghcr.io >/dev/null 2>&1 || true
            docker buildx imagetools inspect "ghcr.io/tasver/${image}:latest" || errors=$((errors+1))
          done
          echo "Images not anonymously accessible: $errors"
          test "$errors" -eq 0
