name: Build THENWISE Docker images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['video/**', 'audio/**', 'scripts/**', 'config/**', 'workflows/**', '.github/workflows/build-images.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [video, audio]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner space for CUDA Docker layers
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-get clean
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target }}/Dockerfile
          push: true
          tags: ghcr.io/tasver/thenwise-${{ matrix.target }}:latest
